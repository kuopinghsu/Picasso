# Checks of the dependencies, run by CI and `make deny`
# (https://embarkstudios.github.io/cargo-deny/).

[graph]
# The platforms Picasso is built for, so dependencies of other platforms
# don't count.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Dependencies of tests and benchmarks aren't shipped.
exclude-dev = true

[advisories]
# Security advisories fail the check; unmaintained crates are listed only
# when Picasso uses them directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses whose terms the notices in each package
# (THIRD-PARTY-NOTICES.txt) fulfill.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # The RAW decoder. Picasso is open source, so anyone can rebuild it with
    # a changed copy, as the LGPL asks of a statically linked library.
    { allow = ["LGPL-2.1"], crate = "rawler" },
    # Used unmodified. The MPL asks that its source be available and that
    # recipients be told where, which THIRD-PARTY-NOTICES.txt does.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
