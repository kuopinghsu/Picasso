[package]
name = "picasso"
version = "0.9.6"
edition = "2021"
rust-version = "1.95"
description = "Fast local photo library and viewer in the style of Picasa"
license = "MIT"
repository = "https://github.com/kuopinghsu/picasso"

[dependencies]
chrono = "0.4"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.37", features = ["glow"] }
egui_system_font_provider = { version = "0.37", default-features = false }
heic-rs = "0.1"
kamadak-exif = "0.6"
rawler = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
notify = "8"
open = "5"
rfd = "0.15"
rusqlite = { version = "0.40", features = ["bundled"] }
trash = "5"
ureq = "3.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
rayon = "1.12.0"
roxmltree = "0.21"
# Without "rayon" each decode starts a thread per color channel, and with
# eight thumbnail workers memory grew by about 1 MB per photo (`make bench`).
jpeg-decoder = { version = "0.3", default-features = false, features = ["rayon"] }
# Text and the font for the elevation chart on route maps; both already come with egui.
ab_glyph = "0.2"
epaint_default_fonts = "0.37"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
flate2 = "1"
ring = "0.17"
base64 = "0.22"
machine-uid = "0.6.0"
# Time zone rules for counting the days of a trip, packaged so they work offline.
chrono-tz = "0.10"

[target.'cfg(unix)'.dependencies]
# Free space before a Story export, and peak memory in the benchmark (`make bench`).
libc = "0.2"

# WordPress Application Passwords, kept in the system's own credential store.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"
