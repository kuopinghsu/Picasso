# Builds and tests Picasso on Windows for every push and pull request, and
# packages picasso.exe plus a .zip. Pushing a tag like `v0.9.0` also publishes
# both files on a GitHub release. The tag must match the version in Cargo.toml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            }
            $label = $version
          } else {
            $label = "$version-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          $name = "picasso-$label-windows-x64"

          New-Item -ItemType Directory -Force -Path dist, "staging/$name" | Out-Null
          Copy-Item target/release/picasso.exe "dist/$name.exe"
          Copy-Item target/release/picasso.exe, README.md, LICENSE "staging/$name/"
          Compress-Archive -Path "staging/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt

          Get-ChildItem dist | Format-Table Name, Length
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.name }}
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Windows x64:** download `picasso-*-windows-x64.exe` and run it, or unzip `picasso-*-windows-x64.zip`. Check downloads against `SHA256SUMS.txt`.

            Videos need [FFmpeg](https://ffmpeg.org) (`winget install Gyan.FFmpeg`). Photos work without it.
