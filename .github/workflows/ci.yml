# Builds and tests Picasso on Windows, Linux, and macOS for every push and
# pull request, then packages it: picasso.exe plus a .zip for Windows, a
# .tar.gz, a .deb, and an AppImage for Linux, and Picasso.app in a .dmg and a
# .zip for macOS. The AppImage is started on Ubuntu and RHEL-compatible
# systems before it is published. Pushing a tag like `v0.9.1` also publishes
# every package on a GitHub release. The tag must match the version in
# Cargo.toml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            }
            $label = $version
          } else {
            $label = "$version-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          $name = "picasso-$label-windows-x64"

          New-Item -ItemType Directory -Force -Path dist, "staging/$name" | Out-Null
          Copy-Item target/release/picasso.exe "dist/$name.exe"
          Copy-Item target/release/picasso.exe, README.md, LICENSE "staging/$name/"
          Compress-Archive -Path "staging/$name" -DestinationPath "dist/$name.zip"

          Get-ChildItem dist | Format-Table Name, Length
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux x64
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          name="picasso-$label-linux-x64"
          strip target/release/picasso
          mkdir -p dist "staging/$name"

          install -m 755 target/release/picasso "staging/$name/"
          install -m 644 README.md LICENSE build/picasso.desktop build/picasso.png "staging/$name/"
          tar -C staging -czf "dist/$name.tar.gz" "$name"

          # Debian versions can't contain "-" without a revision; "~" also
          # sorts a build or pre-release before the release it leads to.
          deb_version=$(echo "$label" | tr '-' '~')
          root=staging/deb
          install -Dm 755 target/release/picasso "$root/usr/bin/picasso"
          install -Dm 644 build/picasso.desktop "$root/usr/share/applications/picasso.desktop"
          install -Dm 644 build/picasso.png "$root/usr/share/icons/hicolor/256x256/apps/picasso.png"
          install -Dm 644 LICENSE "$root/usr/share/doc/picasso/copyright"
          install -Dm 644 README.md "$root/usr/share/doc/picasso/README.md"
          mkdir -p "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<EOF
          Package: picasso
          Version: $deb_version
          Architecture: amd64
          Maintainer: ${GITHUB_REPOSITORY_OWNER} <${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com>
          Installed-Size: $(du -sk "$root/usr" | cut -f1)
          Depends: libc6 (>= 2.35), libasound2 | libasound2t64, libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxrandr2, libxi6
          Recommends: ffmpeg, xdg-desktop-portal
          Section: graphics
          Priority: optional
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Description: Fast local photo library and viewer in the style of Picasa
           Picasso indexes local folders, shows a timeline, folders, albums, and
           places on a map, and edits photos non-destructively.
          EOF
          dpkg-deb --build --root-owner-group "$root" "dist/$name.deb"
          dpkg-deb --info "dist/$name.deb"

          ls -l dist
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    # AlmaLinux 8 has glibc 2.28, so the AppImage runs on RHEL 8, Ubuntu 20.04,
    # Debian 10, and newer.
    runs-on: ubuntu-24.04
    container: almalinux:8
    defaults:
      run:
        shell: bash
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      # The libraries Picasso loads at runtime are installed without their
      # -devel packages, so the build does not record AlmaLinux's library
      # folders and Picasso looks them up by name, as AppRun arranges.
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc make pkgconf-pkg-config alsa-lib-devel git curl tar gzip jq file desktop-file-utils \
            fontconfig libX11 libX11-xcb libxcb libXcursor libXi libxkbcommon libxkbcommon-x11 \
            libwayland-client libwayland-cursor libwayland-egl

      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          name="picasso-$label-linux-x64"
          app=staging/Picasso.AppDir
          strip target/release/picasso
          mkdir -p dist

          install -Dm 755 target/release/picasso "$app/usr/bin/picasso"
          install -Dm 755 build/AppRun "$app/AppRun"
          install -Dm 644 build/picasso.desktop "$app/picasso.desktop"
          install -Dm 644 build/picasso.png "$app/picasso.png"
          install -Dm 644 build/picasso.png "$app/usr/share/icons/hicolor/256x256/apps/picasso.png"
          install -Dm 644 LICENSE "$app/usr/share/doc/picasso/LICENSE"
          install -Dm 644 README.md "$app/usr/share/doc/picasso/README.md"
          ln -s picasso.png "$app/.DirIcon"

          # Libraries Picasso links to or opens at runtime (X11, Wayland, and
          # keyboard maps through winit, fonts through fontconfig, sound
          # through ALSA), with everything they need. glibc, libgcc, and the
          # OpenGL and Vulkan drivers have to match the system, so they stay out.
          wanted="libasound.so.2 libfontconfig.so.1 libxcb.so.1 libX11.so.6 libX11-xcb.so.1 libXcursor.so.1 libXi.so.6
            libxkbcommon.so.0 libxkbcommon-x11.so.0 libwayland-client.so.0 libwayland-cursor.so.0 libwayland-egl.so.1"
          system='^(ld-linux-x86-64|libc|libm|libdl|libpthread|librt|libresolv|libutil|libgcc_s|libGL|libEGL|libGLX|libGLdispatch|libOpenGL|libvulkan)\.so'
          {
            ldd target/release/picasso
            for lib in $wanted; do
              file=$(/sbin/ldconfig -p | awk -v name="$lib" '$1 == name && /x86-64/ { print $NF; exit }')
              if [ -z "$file" ]; then
                echo "::error::$lib is not installed" >&2
                exit 1
              fi
              echo "$lib $file"
              ldd "$file"
            done
          } | awk '$2 ~ /^\// { print $1, $2 } $2 == "=>" && $3 ~ /^\// { print $1, $3 }' | sort -u |
          while read -r lib file; do
            if [[ ! $lib =~ $system ]]; then
              install -Dm 644 "$(readlink -f "$file")" "$app/usr/lib/picasso/$lib/$lib"
            fi
          done
          echo "Bundled libraries:"
          ls "$app/usr/lib/picasso"

          curl -fsSL -o staging/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x staging/appimagetool
          # Containers have no FUSE to mount an AppImage, so the tool runs unpacked.
          (cd staging && ./appimagetool --appimage-extract >/dev/null)
          ARCH=x86_64 VERSION=$label staging/squashfs-root/AppRun --no-appstream "$app" "dist/$name.AppImage"

          ls -l dist
          echo "artifact=$name-appimage" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/*
          if-no-files-found: error

  appimage-test:
    name: AppImage on ${{ matrix.system }}
    needs: appimage
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Ubuntu 22.04
            image: ubuntu:22.04
          - system: Ubuntu 24.04
            image: ubuntu:24.04
          - system: RHEL 8 (AlmaLinux 8)
            image: almalinux:8
          - system: RHEL 9 (AlmaLinux 9)
            image: almalinux:9
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.appimage.outputs.artifact }}

      - name: Unpack
        run: |
          chmod +x picasso-*.AppImage
          ./picasso-*.AppImage --appimage-extract >/dev/null
          ls squashfs-root/usr/lib/picasso

      # The bare image has no display, sound, or font libraries, so AppRun
      # would use every bundled one: together with glibc they must cover
      # everything Picasso and each of them needs.
      - name: Check bundled libraries
        working-directory: squashfs-root
        run: |
          bundled=$(printf '%s:' "$PWD"/usr/lib/picasso/*)
          failed=0
          for file in usr/bin/picasso usr/lib/picasso/*/*; do
            if LD_LIBRARY_PATH=${bundled%:} ldd "$file" 2>&1 | grep 'not found'; then
              echo "::error::$file needs the libraries above"
              failed=1
            fi
          done
          exit $failed

      - name: Install a virtual display
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              xvfb libgl1 libglx-mesa0 libegl1 libegl-mesa0 libgl1-mesa-dri
          else
            dnf install -y --setopt=install_weak_deps=False \
              xorg-x11-server-Xvfb mesa-libGL mesa-libEGL mesa-dri-drivers
          fi

      # Picasso should open its window and keep running until timeout stops it.
      - name: Start Picasso
        run: |
          Xvfb :99 -screen 0 1280x800x24 >xvfb.log 2>&1 &
          xvfb=$!
          sleep 3
          status=0
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 timeout 20 squashfs-root/AppRun || status=$?
          kill "$xvfb"
          if [ "$status" != 124 ]; then
            echo "::error::Picasso quit with status $status within 20 seconds"
            exit 1
          fi
          echo "Picasso was still running after 20 seconds"

  macos:
    name: macOS universal
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${GITHUB_SHA::7}"
          fi
          name="picasso-$label-macos-universal"
          app=staging/dmg/Picasso.app
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"

          # One binary for Apple silicon and Intel Macs.
          lipo -create -output "$app/Contents/MacOS/picasso" \
            target/aarch64-apple-darwin/release/picasso \
            target/x86_64-apple-darwin/release/picasso
          strip -x "$app/Contents/MacOS/picasso"
          lipo -info "$app/Contents/MacOS/picasso"

          iconset=staging/picasso.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" build/picasso.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128; do
            double=$((size * 2))
            sips -z "$double" "$double" build/picasso.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/picasso.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Picasso</string>
            <key>CFBundleDisplayName</key><string>Picasso</string>
            <key>CFBundleIdentifier</key><string>app.Picasso.picasso</string>
            <key>CFBundleExecutable</key><string>picasso</string>
            <key>CFBundleIconFile</key><string>picasso</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>$MACOSX_DEPLOYMENT_TARGET</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.photography</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>MIT License</string>
            <key>NSDesktopFolderUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
            <key>NSDocumentsFolderUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
            <key>NSDownloadsFolderUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
            <key>NSRemovableVolumesUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
            <key>NSNetworkVolumesUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          cp README.md LICENSE staging/dmg/

          # Ad-hoc signature: Apple silicon refuses to run unsigned code. The
          # app is not notarized, so the first launch needs Open from the
          # context menu, or System Settings > Privacy & Security > Open Anyway.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          ditto -c -k --keepParent "$app" "dist/$name.zip"
          ln -s /Applications staging/dmg/Applications
          # hdiutil now and then fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname Picasso -srcfolder staging/dmg -fs HFS+ -format UDZO -ov "dist/$name.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

          ls -l dist
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [windows, linux, appimage, appimage-test, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: picasso-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Windows x64:** download `picasso-*-windows-x64.exe` and run it, or unzip `picasso-*-windows-x64.zip`.

            **Linux x64:** `picasso-*-linux-x64.AppImage` runs without installing anything on Ubuntu 20.04, RHEL 8, Debian 10, and newer: `chmod +x picasso-*-linux-x64.AppImage`, then run it. It carries the libraries Picasso needs besides glibc and the graphics driver. Without FUSE, start it with `--appimage-extract-and-run`. On Ubuntu 22.04 or newer, `sudo apt install ./picasso-*-linux-x64.deb` installs Picasso instead, and `picasso-*-linux-x64.tar.gz` holds the bare program.

            **macOS 11 or later (Apple silicon and Intel):** open `picasso-*-macos-universal.dmg` and drag Picasso to Applications. The app is not notarized, so the first time, Control-click it and choose **Open**, or allow it in **System Settings → Privacy & Security**. `picasso-*-macos-universal.zip` holds the same app.

            Check downloads against `SHA256SUMS.txt`. Videos need [FFmpeg](https://ffmpeg.org) (`winget install Gyan.FFmpeg` on Windows, `sudo apt install ffmpeg` on Debian or Ubuntu, `brew install ffmpeg` on macOS). Without permission to install it, put `ffmpeg` and `ffprobe` beside the AppImage. Photos work without it.
