# Builds and tests Picasso on Windows, Linux, and macOS for every push and
# pull request, then packages it: picasso.exe plus a .zip for Windows, a
# .tar.gz, a .deb, and an AppImage for Linux, each for x64 and Arm64, and
# Picasso.app in a .dmg and a .zip for macOS, and the User Guide as PDF. Every
# package but the bare .exe carries THIRD-PARTY-NOTICES.txt. The .deb is
# installed, started, and removed, and the AppImage is started on Ubuntu and
# RHEL-compatible systems, before they are published. Pushing a tag like `v0.9.5` also publishes
# every package on a GitHub release, with the version's section of
# CHANGELOG.md as the release notes. The tag must match the version in
# Cargo.toml, CHANGELOG.md must have a dated section for it, and a version is
# published only once.
# docs/RELEASING.md has the checklist.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The commit built, tested, and named in package names and `picasso
  # --version` (build.rs). For a pull request it is the branch's own commit
  # rather than the merge GitHub would test, which is in no branch; main is
  # tested again once the pull request is merged.
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Fails in seconds, not after the builds, when a tag doesn't match
  # Cargo.toml, CHANGELOG.md has no dated section for it, or the documents
  # name links, make targets, scripts, or settings that don't exist.
  changelog:
    name: Changelog and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Docs
        run: python3 scripts/check-docs.py

      - name: Check
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            bash scripts/release-notes.sh --release "$version" || {
              echo "::error::CHANGELOG.md needs a dated section for $version"
              exit 1
            }
          else
            bash scripts/release-notes.sh "$version" >/dev/null || {
              echo "::error::CHANGELOG.md has no section for $version"
              exit 1
            }
          fi

  # Security advisories, licenses, and sources of the dependencies (deny.toml).
  # A new advisory fails this job even without a change here, which is the
  # point: a release waits until the dependency is updated.
  deny:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  # Each architecture builds and tests on its own kind of machine, so the
  # tests run on the processor the package is for.
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      # The Arm image may come without rustup, which rust-toolchain needs.
      - name: Install rustup
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { exit 1 }
            "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
          }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            }
            $label = $version
          } else {
            $label = "$version-$($env:SOURCE_COMMIT.Substring(0, 7))"
          }
          $name = "picasso-$label-windows-${{ matrix.arch }}"

          python scripts/third-party-notices.py --target ${{ matrix.target }} -o THIRD-PARTY-NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

          New-Item -ItemType Directory -Force -Path dist, "staging/$name" | Out-Null
          Copy-Item target/release/picasso.exe "dist/$name.exe"
          Copy-Item target/release/picasso.exe, README.md, README_zh-TW.md, CHANGELOG.md, LICENSE, THIRD-PARTY-NOTICES.txt "staging/$name/"
          Compress-Archive -Path "staging/$name" -DestinationPath "dist/$name.zip"

          Get-ChildItem dist | Format-Table Name, Length
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    # The oldest supported runners, so the binary runs on older glibc too.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Performance check
        run: make bench-check

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${SOURCE_COMMIT::7}"
          fi
          name="picasso-$label-linux-${{ matrix.arch }}"
          strip target/release/picasso
          file target/release/picasso
          mkdir -p dist "staging/$name"
          python3 scripts/third-party-notices.py --target ${{ matrix.target }} -o THIRD-PARTY-NOTICES.txt

          install -m 755 target/release/picasso "staging/$name/"
          install -m 644 README.md README_zh-TW.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.txt build/picasso.desktop build/picasso.png "staging/$name/"
          tar -C staging -czf "dist/$name.tar.gz" "$name"

          # Debian versions can't contain "-" without a revision; "~" also
          # sorts a build or pre-release before the release it leads to.
          deb_version=$(echo "$label" | tr '-' '~')
          root=staging/deb
          install -Dm 755 target/release/picasso "$root/usr/bin/picasso"
          install -Dm 644 build/picasso.desktop "$root/usr/share/applications/picasso.desktop"
          install -Dm 644 build/picasso.png "$root/usr/share/icons/hicolor/256x256/apps/picasso.png"
          install -Dm 644 LICENSE "$root/usr/share/doc/picasso/copyright"
          install -Dm 644 README.md "$root/usr/share/doc/picasso/README.md"
          install -Dm 644 README_zh-TW.md "$root/usr/share/doc/picasso/README_zh-TW.md"
          install -Dm 644 CHANGELOG.md "$root/usr/share/doc/picasso/CHANGELOG.md"
          install -Dm 644 THIRD-PARTY-NOTICES.txt "$root/usr/share/doc/picasso/THIRD-PARTY-NOTICES.txt"
          mkdir -p "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<EOF
          Package: picasso
          Version: $deb_version
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: ${GITHUB_REPOSITORY_OWNER} <${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com>
          Installed-Size: $(du -sk "$root/usr" | cut -f1)
          Depends: libc6 (>= 2.35), libasound2 | libasound2t64, libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxrandr2, libxi6
          Recommends: ffmpeg, xdg-desktop-portal
          Section: graphics
          Priority: optional
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Description: Fast local photo library and viewer in the style of Picasa
           Picasso indexes local folders, shows a timeline, folders, albums, and
           places on a map, and edits photos non-destructively.
          EOF
          dpkg-deb --build --root-owner-group "$root" "dist/$name.deb"
          dpkg-deb --info "dist/$name.deb"

          ls -l dist
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Installs the .deb as a user would, checks that every library it needs
      # is there and that the window opens, then removes it and checks that
      # nothing is left behind.
      - name: Install, start, and remove the .deb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri desktop-file-utils "./dist/${{ steps.package.outputs.name }}.deb"
          dpkg -s picasso | grep -E '^(Status|Version):'
          desktop-file-validate /usr/share/applications/picasso.desktop
          if ldd /usr/bin/picasso | grep 'not found'; then
            echo "::error::The installed picasso needs the libraries above"
            exit 1
          fi
          picasso --version | tee version.txt
          grep -q "${SOURCE_COMMIT::7}" version.txt || { echo "::error::picasso --version doesn't name commit ${SOURCE_COMMIT::7}"; exit 1; }

          status=0
          HOME=$(mktemp -d) LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 20 picasso || status=$?
          if [ "$status" != 124 ]; then
            echo "::error::Picasso quit with status $status within 20 seconds"
            exit 1
          fi

          sudo apt-get remove -y picasso
          for path in /usr/bin/picasso /usr/share/applications/picasso.desktop /usr/share/icons/hicolor/256x256/apps/picasso.png /usr/share/doc/picasso; do
            if [ -e "$path" ]; then
              echo "::error::$path is still there after removing the package"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  appimage:
    name: Linux AppImage ${{ matrix.arch }}
    # AlmaLinux 8 has glibc 2.28, so the AppImage runs on RHEL 8, Ubuntu 20.04,
    # Debian 10, and newer.
    runs-on: ${{ matrix.runner }}
    container: almalinux:8
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      # The libraries Picasso loads at runtime are installed without their
      # -devel packages, so the build does not record AlmaLinux's library
      # folders and Picasso looks them up by name, as AppRun arranges.
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc make pkgconf-pkg-config alsa-lib-devel git curl tar gzip jq file desktop-file-utils python3 \
            fontconfig libX11 libX11-xcb libxcb libXcursor libXi libxkbcommon libxkbcommon-x11 \
            libwayland-client libwayland-cursor libwayland-egl

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${SOURCE_COMMIT::7}"
          fi
          # Same script as `make appimage`; it builds for the machine it runs on.
          VERSION=$label bash scripts/package-appimage.sh
          test -s "dist/picasso-$label-linux-${{ matrix.arch }}.AppImage"
          ls -l dist
          echo "artifact=picasso-$label-linux-${{ matrix.arch }}-appimage" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/*
          if-no-files-found: error

  appimage-test:
    name: AppImage ${{ matrix.arch }} on ${{ matrix.system }}
    needs: appimage
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        system: [Ubuntu 22.04, Ubuntu 24.04, RHEL 8 (AlmaLinux 8), RHEL 9 (AlmaLinux 9)]
        include:
          - system: Ubuntu 22.04
            image: ubuntu:22.04
          - system: Ubuntu 24.04
            image: ubuntu:24.04
          - system: RHEL 8 (AlmaLinux 8)
            image: almalinux:8
          - system: RHEL 9 (AlmaLinux 9)
            image: almalinux:9
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: picasso-*-linux-${{ matrix.arch }}-appimage
          merge-multiple: true

      - name: Unpack
        run: |
          chmod +x picasso-*.AppImage
          ./picasso-*.AppImage --appimage-extract >/dev/null
          ls squashfs-root/usr/lib/picasso
          test -s squashfs-root/usr/share/doc/picasso/THIRD-PARTY-NOTICES.txt
          cat squashfs-root/usr/share/doc/picasso/libraries/README.txt

      # The bare image has no display, sound, or font libraries, so AppRun
      # would use every bundled one: together with glibc they must cover
      # everything Picasso and each of them needs.
      - name: Check bundled libraries
        working-directory: squashfs-root
        run: |
          bundled=$(printf '%s:' "$PWD"/usr/lib/picasso/*)
          failed=0
          for file in usr/bin/picasso usr/lib/picasso/*/*; do
            if LD_LIBRARY_PATH=${bundled%:} ldd "$file" 2>&1 | grep 'not found'; then
              echo "::error::$file needs the libraries above"
              failed=1
            fi
          done
          exit $failed

      - name: Install a virtual display
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              xvfb libgl1 libglx-mesa0 libegl1 libegl-mesa0 libgl1-mesa-dri
          else
            dnf install -y --setopt=install_weak_deps=False \
              xorg-x11-server-Xvfb mesa-libGL mesa-libEGL mesa-dri-drivers
          fi

      # Picasso should open its window and keep running until timeout stops it.
      - name: Start Picasso
        run: |
          Xvfb :99 -screen 0 1280x800x24 >xvfb.log 2>&1 &
          xvfb=$!
          sleep 3
          status=0
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 timeout 20 squashfs-root/AppRun || status=$?
          kill "$xvfb"
          if [ "$status" != 124 ]; then
            echo "::error::Picasso quit with status $status within 20 seconds"
            exit 1
          fi
          echo "Picasso was still running after 20 seconds"

  # With the secrets below set in the repository, the app and the disk image
  # are signed with a Developer ID and notarized by Apple, so they open
  # without a warning. Without them, the app gets an ad-hoc signature.
  #   MACOS_CERTIFICATE           base64 of the Developer ID Application .p12
  #   MACOS_CERTIFICATE_PASSWORD  password of the .p12
  #   APPLE_ID, APPLE_TEAM_ID     the Apple account and team that notarize
  #   APPLE_APP_PASSWORD          an app-specific password of that account
  macos:
    name: macOS universal
    runs-on: macos-14
    outputs:
      notarized: ${{ steps.package.outputs.notarized }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package
        id: package
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
              exit 1
            fi
            label=$version
          else
            label="$version-${SOURCE_COMMIT::7}"
          fi
          name="picasso-$label-macos-universal"
          python3 scripts/third-party-notices.py --target aarch64-apple-darwin --target x86_64-apple-darwin -o THIRD-PARTY-NOTICES.txt
          app=staging/dmg/Picasso.app
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"

          # One binary for Apple silicon and Intel Macs.
          lipo -create -output "$app/Contents/MacOS/picasso" \
            target/aarch64-apple-darwin/release/picasso \
            target/x86_64-apple-darwin/release/picasso
          strip -x "$app/Contents/MacOS/picasso"
          lipo -info "$app/Contents/MacOS/picasso"

          iconset=staging/picasso.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" build/picasso.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128; do
            double=$((size * 2))
            sips -z "$double" "$double" build/picasso.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/picasso.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Picasso</string>
            <key>CFBundleDisplayName</key><string>Picasso</string>
            <key>CFBundleIdentifier</key><string>app.Picasso.picasso</string>
            <key>CFBundleExecutable</key><string>picasso</string>
            <key>CFBundleIconFile</key><string>picasso</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>$MACOSX_DEPLOYMENT_TARGET</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.photography</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>MIT License</string>
            <key>NSDesktopFolderUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
            <key>NSDocumentsFolderUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
            <key>NSDownloadsFolderUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
            <key>NSRemovableVolumesUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
            <key>NSNetworkVolumesUsageDescription</key><string>Picasso shows the photos in the folders you add.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          cp THIRD-PARTY-NOTICES.txt "$app/Contents/Resources/"
          cp README.md README_zh-TW.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.txt staging/dmg/

          notarize=false
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            notarize=true
          fi
          if $notarize; then
            keychain=$RUNNER_TEMP/signing.keychain-db
            keychain_password=$(uuidgen)
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/certificate.p12"
            identity="Developer ID Application"
            # Hardened runtime and a secure timestamp, as notarization requires.
            codesign --force --options runtime --timestamp --sign "$identity" "$app"
          else
            # Ad-hoc signature: Apple silicon refuses to run unsigned code. The
            # app is not notarized, so the first launch needs System Settings >
            # Privacy & Security > Open Anyway (or, up to macOS 14, Open from
            # the context menu).
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict "$app"

          if $notarize; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$app"
          fi

          ditto -c -k --keepParent "$app" "dist/$name.zip"
          ln -s /Applications staging/dmg/Applications
          # hdiutil now and then fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname Picasso -srcfolder staging/dmg -fs HFS+ -format UDZO -ov "dist/$name.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

          if $notarize; then
            codesign --force --timestamp --sign "$identity" "dist/$name.dmg"
            xcrun notarytool submit "dist/$name.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "dist/$name.dmg"
            spctl --assess --type open --context context:primary-signature -v "dist/$name.dmg"
            security delete-keychain "$keychain"
          fi

          ls -l dist
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "notarized=$notarize" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error

  # The User Guide as PDF in English and Traditional Chinese (make guide-pdf),
  # kept with every run and published with each release. A character none of
  # the fonts has fails the job rather than printing as a box.
  guide:
    name: User Guide PDF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Install Asciidoctor PDF and fonts
        run: |
          set -euo pipefail
          sudo gem install --no-document asciidoctor-pdf -v 2.3.15
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-droid-fallback fonts-dejavu-core

      - name: Build
        id: guide
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            label=$version
          else
            label=$version-${SOURCE_COMMIT:0:7}
          fi
          make guide-pdf
          mkdir -p dist
          cp target/guide/USER_GUIDE.pdf "dist/picasso-$label-user-guide.pdf"
          cp target/guide/USER_GUIDE_zh-TW.pdf "dist/picasso-$label-user-guide-zh-TW.pdf"
          ls -l dist
          echo "name=picasso-$label-user-guide" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.guide.outputs.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [changelog, deny, windows, linux, appimage, appimage-test, macos, guide]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            CHANGELOG.md
            Cargo.lock
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false

      # A published release is never replaced: a fix ships as the next patch
      # version, so a version always names the same files.
      - name: Check that this version isn't published yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is already published. Release the fix as the next patch version instead of moving the tag."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: picasso-*
          path: dist
          merge-multiple: true

      - name: Check the packages
        working-directory: dist
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          missing=0
          suffixes="macos-universal.dmg macos-universal.zip user-guide.pdf user-guide-zh-TW.pdf"
          for arch in x64 arm64; do
            suffixes="$suffixes windows-$arch.exe windows-$arch.zip linux-$arch.tar.gz linux-$arch.deb linux-$arch.AppImage"
          done
          for suffix in $suffixes; do
            file="picasso-$version-$suffix"
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing"
              missing=1
            fi
          done
          extra=$(ls | grep -v "^picasso-$version-" || true)
          if [ -n "$extra" ]; then
            echo "::error::Unexpected files: $extra"
            missing=1
          fi
          exit $missing

      # rawler is under the LGPL-2.1, which asks that its source be offered
      # from the same place as the program. This is the crate the packages
      # were built from, checked against Cargo.lock.
      - name: rawler source
        run: |
          set -euo pipefail
          read -r version checksum < <(awk '
            /^name = / { name = $3 }
            name == "\"rawler\"" && /^version = / { version = $3 }
            name == "\"rawler\"" && /^checksum = / { print version, $3; exit }
          ' Cargo.lock | tr -d '"')
          file="dist/rawler-$version-source.tar.gz"
          curl -fsSL -o "$file" "https://static.crates.io/crates/rawler/rawler-$version.crate"
          echo "$checksum  $file" | sha256sum --check

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The release notes are this version's section of CHANGELOG.md, followed
      # by the download instructions.
      - name: Release notes
        env:
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          set -euo pipefail
          if [ "$NOTARIZED" = true ]; then
            mac_open="The app is signed and notarized by Apple."
          else
            mac_open="The app is not notarized, so the first launch is blocked: click **Open Anyway** in **System Settings → Privacy & Security**. On macOS 14 and older, Control-clicking it and choosing **Open** also works."
          fi
          {
            bash scripts/release-notes.sh --release "$GITHUB_REF_NAME"
            echo
            echo "## Downloads"
            echo
            cat <<'EOF'
          **Windows:** download `picasso-*-windows-x64.exe` and run it, or unzip `picasso-*-windows-x64.zip`. On a Windows PC with an Arm processor, such as a Snapdragon laptop, use `picasso-*-windows-arm64.exe` or `picasso-*-windows-arm64.zip`.

          **Linux:** `picasso-*-linux-x64.AppImage` runs without installing anything on Ubuntu 20.04, RHEL 8, Debian 10, and newer: `chmod +x picasso-*-linux-x64.AppImage`, then run it. It carries the libraries Picasso needs besides glibc and the graphics driver. Without FUSE, start it with `--appimage-extract-and-run`. On Ubuntu 22.04 or newer, `sudo apt install ./picasso-*-linux-x64.deb` installs Picasso instead, and `picasso-*-linux-x64.tar.gz` holds the bare program. On 64-bit Arm Linux, use the same packages named `linux-arm64`.

          **macOS 11 or later (Apple silicon and Intel):** open `picasso-*-macos-universal.dmg` and drag Picasso to Applications. @@MAC_OPEN@@ `picasso-*-macos-universal.zip` holds the same app.

          Check downloads against `SHA256SUMS.txt`. Videos need [FFmpeg](https://ffmpeg.org) (`winget install Gyan.FFmpeg` on Windows, `sudo apt install ffmpeg` on Debian or Ubuntu, `brew install ffmpeg` on macOS). Without permission to install it, put `ffmpeg` and `ffprobe` beside the AppImage. Photos work without it. Every package but the bare `.exe` carries `THIRD-PARTY-NOTICES.txt`, the licenses of the libraries built into Picasso. `rawler-*-source.tar.gz` is the source of rawler, the RAW decoder Picasso is built with, as its license (LGPL-2.1) asks.

          **User Guide:** `picasso-*-user-guide.pdf` in English and `picasso-*-user-guide-zh-TW.pdf` in Traditional Chinese.

          Built from commit @@COMMIT@@.
          EOF
          } > release-notes.md
          mac_open=${mac_open//&/\\&}
          sed -i "s|@@MAC_OPEN@@|$mac_open|; s|@@COMMIT@@|$SOURCE_COMMIT|" release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
